<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuildControl Pro — Şantiye Yönetim Sistemi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    /* Endüstriyel palet: çelik + beton + emniyet turuncusu */
    --steel-900:#221F1B;
    --steel-800:#2C2823;
    --steel-700:#3A342C;
    --orange-600:#FF5A1F;
    --orange-500:#FF7A45;
    --orange-50:#FFF0E8;
    --amber-500:#F0A824;
    --amber-50:#FEF3E0;
    --green-600:#3F8F5B;
    --green-50:#E9F5EC;
    --rust-600:#C1432B;
    --rust-50:#FBEAE6;
    --concrete-100:#EFEBE3;
    --concrete-50:#F7F4EE;
    --card:#FDFBF7;
    --ink-900:#221F1B;
    --ink-600:#5C5548;
    --ink-400:#948C7C;
    --border:#DCD5C7;
    --border-strong:#C7BEAB;
    --shadow:drop-shadow(0 1px 2px rgba(34,31,27,.05)) drop-shadow(0 6px 16px rgba(34,31,27,.06));
    --notch:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    background:var(--concrete-100);
    background-image: radial-gradient(circle at 1px 1px, rgba(34,31,27,.05) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--ink-900);
    display:flex;
    min-height:100vh;
    font-size:14px;
  }
  ::selection{background:var(--orange-600); color:#fff;}
  .mono{font-family:'IBM Plex Mono', monospace; letter-spacing:-0.01em;}
  .stencil{font-family:'Big Shoulders Display', sans-serif; text-transform:uppercase;}
 
  /* ---------- Sidebar ---------- */
  .sidebar{
    width:264px; flex-shrink:0;
    background:linear-gradient(180deg, var(--steel-900), var(--steel-800));
    color:#CEC6B8; display:flex; flex-direction:column;
    height:100vh; position:sticky; top:0;
  }
  .hazard-strip{
    height:5px; width:100%; flex-shrink:0;
    background:repeating-linear-gradient(-45deg, var(--orange-600) 0 10px, #191612 10px 20px);
  }
  .brand{
    display:flex; align-items:center; gap:12px;
    padding:22px 20px 20px; border-bottom:1px solid rgba(255,255,255,.07);
  }
  .brand-mark{
    width:42px; height:42px; flex-shrink:0;
    background:var(--orange-600); color:#1A1712;
    display:flex; align-items:center; justify-content:center;
    font-family:'Big Shoulders Display'; font-weight:800; font-size:19px;
    clip-path:polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
  }
  .brand-text .name{font-family:'Big Shoulders Display'; font-weight:800; font-size:19px; color:#fff; letter-spacing:.01em; line-height:1;}
  .brand-text .sub{font-size:10.5px; color:#8C8272; margin-top:4px; letter-spacing:.06em; text-transform:uppercase; font-weight:600;}
 
  .nav{flex:1; overflow-y:auto; padding:16px 12px;}
  .nav::-webkit-scrollbar{width:5px;}
  .nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12); border-radius:10px;}
  .nav-item{
    display:flex; align-items:center; gap:11px;
    padding:10px 12px; color:#A99F8C; font-size:13px; font-weight:500;
    cursor:pointer; margin-bottom:2px; position:relative; white-space:nowrap;
    border-left:3px solid transparent;
  }
  .nav-item svg{width:17px; height:17px; flex-shrink:0; opacity:.8;}
  .nav-item:hover{background:rgba(255,255,255,.05); color:#fff;}
  .nav-item.active{background:rgba(255,90,31,.14); color:#fff; border-left-color:var(--orange-600);}
  .nav-item .chev{margin-left:auto; width:12px; height:12px; opacity:.5;}
 
  .sidebar-user{padding:16px 18px; border-top:1px solid rgba(255,255,255,.07); display:flex; align-items:center; gap:10px;}
  .avatar{
    width:34px; height:34px; flex-shrink:0; background:var(--orange-600); color:#1A1712;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;
    clip-path:polygon(0 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 0 100%);
  }
  .sidebar-user .uname{font-size:13px; font-weight:700; color:#fff;}
  .sidebar-user .urole{font-size:10.5px; color:#8C8272; text-transform:uppercase; letter-spacing:.04em; font-weight:600;}
 
  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    height:66px; flex-shrink:0; background:var(--card);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 26px; position:sticky; top:0; z-index:20;
  }
  .project-select{
    display:flex; align-items:center; gap:10px;
    border:1.5px solid var(--border-strong); padding:8px 14px;
    font-size:12.5px; font-weight:600; color:var(--ink-600);
    background:var(--concrete-50); clip-path:polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 0 100%);
  }
  .project-select .label{color:var(--ink-400); text-transform:uppercase; font-size:10.5px; letter-spacing:.05em;}
  .project-select select{border:none; background:transparent; font:inherit; font-weight:700; color:var(--ink-900); cursor:pointer; outline:none;}
 
  .topbar-right{display:flex; align-items:center; gap:16px;}
  .btn-action{
    background:var(--orange-600); color:#fff; font-family:'Big Shoulders Display'; font-weight:800;
    font-size:16px; text-transform:uppercase; letter-spacing:.04em; border:none; padding:9px 18px;
    cursor:pointer; clip-path:polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
    box-shadow: 0 4px 12px rgba(255,90,31,0.3);
    transition:transform .15s, background .15s;
  }
  .btn-action:hover{background:var(--orange-500); transform:translateY(-1px);}

  .icon-btn{position:relative; width:38px; height:38px; display:flex; align-items:center; justify-content:center; color:var(--ink-600); cursor:pointer;}
  .icon-btn:hover{background:var(--concrete-50);}
  .icon-btn svg{width:19px; height:19px;}
  .badge{
    position:absolute; top:3px; right:3px; min-width:16px; height:16px; padding:0 4px;
    background:var(--orange-600); color:#fff; font-size:9.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    clip-path:polygon(0 0, calc(100% - 4px) 0, 100% 4px, 100% 100%, 0 100%);
  }
  .topbar-user{display:flex; align-items:center; gap:9px; padding-left:16px; border-left:1px solid var(--border); cursor:pointer;}
  .topbar-user .tname{font-size:12.5px; font-weight:700; color:var(--ink-900);}
  .topbar-user .tco{font-size:10.5px; color:var(--ink-400); text-transform:uppercase; letter-spacing:.04em;}
 
  .content{padding:26px; flex:1; overflow-y:auto;}
 
  /* ---------- KPI cards ---------- */
  .kpi-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:14px; margin-bottom:22px;}
  .kpi-card{
    background:var(--card); border:1px solid var(--border);
    padding:16px 16px 14px; filter:var(--shadow);
    clip-path:polygon(0 0, calc(100% - var(--notch)) 0, 100% var(--notch), 100% 100%, 0 100%);
    display:flex; flex-direction:column; gap:9px; position:relative; cursor:pointer;
    transition:transform .15s ease;
  }
  .kpi-card:hover{transform:translateY(-2px);}
  .kpi-card::after{
    content:""; position:absolute; top:6px; right:6px; width:4px; height:4px; border-radius:50%;
    background:var(--border-strong);
  }
  .kpi-eyebrow{font-size:10.5px; font-weight:700; color:var(--ink-400); text-transform:uppercase; letter-spacing:.05em;}
  .kpi-value{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:700; color:var(--ink-900); letter-spacing:-.02em;}
  .kpi-sub{font-size:11px; font-weight:600; color:var(--accent,var(--orange-600));}

  /* Belirgin Vurgulu Paneller */
  .prominent-panel {
    background: #FFFDF9;
    border: 2px solid var(--orange-600);
    filter: drop-shadow(0 4px 16px rgba(255,90,31,0.12));
    clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 0 100%);
    margin-bottom: 22px;
    position: relative;
  }
  .prominent-head {
    background: var(--steel-900);
    color: #fff;
    padding: 14px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .prominent-title {
    font-family: 'Big Shoulders Display';
    font-size: 19px;
    font-weight: 800;
    letter-spacing: .03em;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .new-tag-pulse {
    background: var(--orange-600);
    color: #fff;
    font-family: 'IBM Plex Mono';
    font-size: 10px;
    font-weight: 800;
    padding: 2px 8px;
    clip-path: polygon(0 0, calc(100% - 4px) 0, 100% 4px, 100% 100%, 0 100%);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }

  /* ---------- Panels ---------- */
  .row{display:grid; gap:16px; margin-bottom:16px;}
  .row-3{grid-template-columns:1fr 1.6fr 1fr;}
  .row-2{grid-template-columns:1.55fr 1fr;}
  .panel{
    background:var(--card); border:1px solid var(--border); filter:var(--shadow);
    clip-path:polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
    display:flex; flex-direction:column; position:relative;
  }
  .panel::after{content:"";position:absolute; top:8px; right:8px; width:5px; height:5px; border-radius:50%; background:var(--border-strong);}
  .panel-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px 4px;}
  .panel-title{font-family:'Big Shoulders Display'; font-weight:700; font-size:17px; text-transform:uppercase; letter-spacing:.02em; color:var(--ink-900);}
  .panel-link{font-size:11.5px; font-weight:700; color:var(--orange-600); cursor:pointer; text-transform:uppercase; letter-spacing:.03em;}
  .panel-body{padding:0 22px 20px;}
 
  .dimline{position:relative; height:1px; background:var(--border); margin:10px 22px 16px;}
  .dimline::before,.dimline::after{content:""; position:absolute; top:-4px; width:1px; height:9px; background:var(--border-strong);}
  .dimline::before{left:0;} .dimline::after{right:0;}
  .dimline .dimtag{
    position:absolute; top:-8px; left:22px; background:var(--card); padding:0 8px;
    font-family:'IBM Plex Mono'; font-size:9.5px; color:var(--ink-400); letter-spacing:.04em;
  }
 
  .donut-wrap{position:relative; display:flex; align-items:center; justify-content:center; padding:6px 0;}
  .donut-center{position:absolute; text-align:center;}
  .donut-center .big{font-family:'IBM Plex Mono'; font-size:22px; font-weight:700; color:var(--ink-900);}
  .donut-center .small{font-size:10px; color:var(--ink-400); font-weight:600; text-transform:uppercase; letter-spacing:.04em; margin-top:2px;}
  .legend{display:flex; flex-direction:column; gap:9px; justify-content:center;}
  .legend-row{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-600); font-weight:500;}
  .dot{width:9px; height:9px; flex-shrink:0;}
  .legend-row b{margin-left:auto; font-family:'IBM Plex Mono'; color:var(--ink-900);}
  .donut-flex{display:flex; align-items:center; gap:20px;}
 
  .gantt-toolbar{display:flex; align-items:center; gap:8px;}
  .pill{font-family:'IBM Plex Mono'; font-size:10.5px; font-weight:700; padding:5px 11px; background:var(--steel-900); color:#fff; cursor:pointer; user-select:none;}
  .pill-outline{background:var(--concrete-50); border:1px solid var(--border-strong); color:var(--ink-600); font-weight:600;}
  .gantt{display:flex; flex-direction:column; gap:2px;}
  .gantt-row{display:grid; grid-template-columns:132px 1fr; align-items:center; height:29px;}
  .gantt-label{font-size:11.5px; font-weight:600; color:var(--ink-600); padding-right:8px;}
  .gantt-track{position:relative; height:100%; display:flex; align-items:center;}
  .gantt-bar{height:10px; position:absolute; border-radius:2px; transition:all .2s ease;}
  .today-line{position:absolute; top:-6px; bottom:-6px; width:2px; background:var(--orange-600); left:38%;}
  .today-tag{position:absolute; top:-25px; left:38%; transform:translateX(-50%); background:var(--orange-600); color:#fff; font-size:9.5px; font-weight:700; padding:2px 9px; font-family:'IBM Plex Mono';}
 
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-400); font-weight:700; padding:8px 10px; border-bottom:1.5px solid var(--border-strong);}
  td{padding:9px 10px; border-bottom:1px solid var(--concrete-50); color:var(--ink-600); font-weight:500;}
  tr:last-child td{border-bottom:none;}
  .mono-cell{font-family:'IBM Plex Mono'; font-weight:600; color:var(--ink-900);}
  .tag{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; padding:3px 10px; text-transform:uppercase; letter-spacing:.03em;}
  .tag-ok{background:var(--green-50); color:var(--green-600);}
  .tag-fix{background:var(--amber-50); color:var(--amber-500);}
  .tag-bad{background:var(--rust-50); color:var(--rust-600);}
 
  .report-item{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--concrete-50);}
  .report-item:last-child{border-bottom:none; padding-bottom:0;}
  .report-thumb{
    width:52px; height:52px; flex-shrink:0; border:1px solid var(--border);
    background:repeating-linear-gradient(45deg, var(--concrete-50) 0 6px, #EDE6D8 6px 12px);
    display:flex; align-items:center; justify-content:center; color:var(--orange-600);
    clip-path:polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
  }
  .report-thumb svg{width:22px; height:22px;}
  .report-date{font-size:12.5px; font-weight:700; color:var(--ink-900); font-family:'IBM Plex Mono';}
  .report-desc{font-size:12px; color:var(--ink-400); margin-top:2px;}
  .check-ok{margin-left:auto; color:var(--green-600); flex-shrink:0;}
 
  .audit-item{display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px solid var(--concrete-50);}
  .audit-item:last-child{border-bottom:none;}
  .audit-icon{width:34px; height:34px; flex-shrink:0; display:flex; align-items:center; justify-content:center; clip-path:polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);}
  .audit-title{font-size:12.5px; font-weight:700; color:var(--ink-900);}
  .audit-date{font-size:11px; color:var(--ink-400); font-family:'IBM Plex Mono'; margin-top:1px;}
 
  .equip-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
  .equip-card{
    border:1px solid var(--border); padding:15px; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    clip-path:polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
    background:var(--card); cursor:pointer; transition:transform .15s, border-color .15s;
  }
  .equip-card:hover{ transform:translateY(-3px); border-color:var(--orange-600); box-shadow:0 6px 16px rgba(255,90,31,0.15); }
  .equip-icon{width:50px; height:50px; background:var(--concrete-50); display:flex; align-items:center; justify-content:center; color:var(--steel-900);}
  .equip-icon svg{width:25px; height:25px;}
  .equip-name{font-size:12px; font-weight:700; color:var(--ink-900);}
  .equip-status{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
  .status-run{color:var(--green-600);}
  .status-maint{color:var(--amber-500);}
  .equip-hours{font-size:10.5px; color:var(--ink-400); font-family:'IBM Plex Mono';}

  /* Modals */
  .modal-overlay{
    position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(34,31,27,.75);
    backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .modal-box{
    background:var(--card); border:2px solid var(--border-strong); width:100%; max-width:680px;
    clip-path:polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
    box-shadow:0 20px 50px rgba(0,0,0,.3); display:flex; flex-direction:column;
  }
  .modal-header{
    background:var(--steel-900); color:#fff; padding:16px 20px; display:flex; align-items:center; justify-content:space-between;
    font-family:'Big Shoulders Display'; font-size:18px; font-weight:800; letter-spacing:.03em;
  }
  .modal-body{padding:20px; overflow-y:auto; max-height:80vh;}
  .modal-footer{padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; background:var(--concrete-50);}
  .form-group{display:flex; flex-direction:column; gap:4px; margin-bottom:12px;}
  .form-group label{font-size:11px; font-weight:700; text-transform:uppercase; color:var(--ink-600); letter-spacing:.04em;}
  .form-group input, .form-group select, .form-group textarea{
    padding:8px 12px; border:1px solid var(--border-strong); background:#fff; font:inherit; font-size:13px; outline:none;
  }

  .prj-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 14px; }
  .prj-card {
    background: #fff; border: 1px solid var(--border); padding: 16px;
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%);
    display: flex; flex-direction: column; justify-content: space-between;
  }
 
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);}
 
  @media (max-width:1400px){
    .kpi-grid{grid-template-columns:repeat(3,1fr);}
    .row-3{grid-template-columns:1fr;}
    .row-2{grid-template-columns:1fr;}
    .equip-grid{grid-template-columns:repeat(2,1fr);}
    .prj-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
 
<aside class="sidebar">
  <div class="hazard-strip"></div>
  <div class="brand">
    <div class="brand-mark">BC</div>
    <div class="brand-text">
      <div class="name">BuildControl</div>
      <div class="sub">Şantiye Yönetim Sistemi</div>
    </div>
  </div>
  <nav class="nav" id="navList"></nav>
  <div class="sidebar-user">
    <div class="avatar">ES</div>
    <div>
      <div class="uname">Engin Soydan</div>
      <div class="urole">Proje Yöneticisi</div>
    </div>
  </div>
</aside>
 
<div class="main">
  <div class="topbar">
    <div class="project-select">
      <span class="label">Aktif Proje</span>
      <select id="projectSelect" onchange="updateProjectSelect(this.value)">
        <!-- Options populated dynamically -->
      </select>
    </div>
    <div class="topbar-right">
      <button class="btn-action" onclick="openQuickModal()">+ HIZLI SAHA İŞLEMİ</button>
      <div class="icon-btn" title="Bildirimler">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span class="badge" id="notifBadge">3</span>
      </div>
      <div class="topbar-user">
        <div class="avatar" style="width:32px;height:32px;font-size:11px;">AİA</div>
        <div>
          <div class="tname">ABC İnşaat A.Ş.</div>
          <div class="tco">Firma Yöneticisi</div>
        </div>
      </div>
    </div>
  </div>
 
  <div class="content" id="content"></div>
</div>

<div id="modalContainer"></div>
 
<script>
// Dynamic API path detection for any port
const API_BASE = window.location.origin + '/api';

let PROJECTS_DATA = [
  { id:'KV-2024', name:'Kent Villaları Konut Projesi', employer:'ABC Holding A.Ş.', budget:'₺120.000.000', progress:63, status:'Devam Ediyor', date:'2024-01-15' },
  { id:'MV-2024', name:'Metro Viyadük İnşaatı', employer:'İBB Ulaşım Daire Bşk.', budget:'₺340.000.000', progress:48, status:'Devam Ediyor', date:'2023-09-01' },
  { id:'MP-2023', name:'Merkez Plaza İş Kulesi', employer:'Global Finans Yatırım', budget:'₺210.000.000', progress:100, status:'Tamamlandı', date:'2022-04-10' }
];

let QUICK_LOGS = [
  { time: '13:14', user: 'Engin Soydan', type: 'Şantiye Defteri', detail: 'A Blok 3. kat tabliye beton dökümü tamamlandı (120 m³ C30 hazır beton kullanıldı).', isNew: false },
  { time: '11:45', user: 'Melis Karadağ', type: 'Beton Kırımı', detail: 'K-125 numunesi 28 günlük basınç testi 32.1 MPa (Uygun).', isNew: false },
  { time: '09:30', user: 'Volkan Yıldırım', type: 'İSG Denetimi', detail: 'Kule vinç geçiş alanı güvenlik şeridi yenilendi.', isNew: false }
];

let PERSONNEL_DATA = [

async function syncSQLData() {
  try {
    const prjRes = await fetch(`${API_BASE}/projects`);
    if (prjRes.ok) {
      const prjs = await prjRes.json();
      if(prjs.length > 0) {
        PROJECTS_DATA = prjs.map(p => ({
          id: p.id, name: p.name, employer: p.employer, 
          budget: `₺${Number(p.budget).toLocaleString('tr-TR')}`, 
          progress: p.progress_percent || p.progress, 
          status: p.status, date: p.start_date
        }));
      }
    }

    const perRes = await fetch(`${API_BASE}/personnel`);
    if (perRes.ok) {
      const pers = await perRes.json();
      if(pers.length > 0) {
        PERSONNEL_DATA = pers.map(p => ({
          name: p.full_name, role: p.role, certs: p.certs, site: p.assigned_site, status: p.status, isNew: p.is_new
        }));
      }
    }

    const logRes = await fetch(`${API_BASE}/quicklogs`);
    if (logRes.ok) {
      const logs = await logRes.json();
      if(logs.length > 0) {
        QUICK_LOGS = logs.map(l => ({
          time: l.log_time || '12:00', user: l.user_name, type: l.log_type, detail: l.detail, isNew: l.is_new
        }));
      }
    }
  } catch(e) {}
}

function selectModule(id){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.id===id));
  const content = document.getElementById('content');
  if(id === 'dashboard'){
    renderDashboard();
  } else if(id === 'projeler') {
    renderProjects();
  } else if(id === 'santiye') {
    renderSiteLogs();
  } else if(id === 'hakedis') {
    renderHakedis();
  } else if(id === 'beton') {
    renderConcrete();
  } else if(id === 'is-programi') {
    renderGanttDetail();
  } else if(id === 'personel') {
    renderPersonnel();
  } else if(id === 'ekipman') {
    renderEquipmentDetail();
  } else if(id === 'malzeme') {
    renderMaterials();
  } else if(id === 'evrak') {
    renderDocs();
  } else if(id === 'guvenlik') {
    renderSafety();
  } else if(id === 'denetimler') {
    renderAuditsDetail();
  } else if(id === 'raporlar') {
    renderReports();
  } else {
    content.innerHTML = `
      <div class="panel" style="padding:30px;">
        <div class="panel-title" style="font-size:22px;">${id.toUpperCase()} MODÜLÜ</div>
        <p style="color:var(--ink-600); margin-top:10px;">Modül ekranı aktif durumda çalışmaktadır.</p>
      </div>`;
  }
}

async function submitQuickAction() {
  const type = document.getElementById('quickTypeSelect').value;
  const detail = document.getElementById('quickDetailInput').value || 'Saha imalat açıklaması kaydedildi.';
  const now = new Date();
  const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  
  const newLog = {
    time: timeStr, user: 'Engin Soydan (Şantiye Şefi)', type: type, detail: detail, isNew: true
  };

  try {
    await fetch(`${API_BASE}/quicklogs`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_name: newLog.user, log_type: type, detail: detail, project_id: 'KV-2024' })
    });
  } catch(e) {}

  QUICK_LOGS.unshift(newLog);
  closeModal();
  selectModule('dashboard');
}

  const code = document.getElementById('prjCodeInput').value || `PRJ-0${PROJECTS_DATA.length+1}`;
  const name = document.getElementById('prjNameInput').value || 'Yeni Konut Projesi';
  const employer = document.getElementById('prjEmpInput').value || 'İşveren Yatırım A.Ş.';
  const budget = document.getElementById('prjBudInput').value || '₺95.000.000';

  const newPrj = {
    id: code, name: name, employer: employer, budget: budget, progress: 5, status: 'Yeni Planlandı', date: new Date().toISOString().split('T')[0]
  };

  try {
    await fetch(`${API_BASE}/projects`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: code, name: name, employer: employer, budget: parseFloat(budget.replace(/[^0-9]/g, '')) || 95000000, progress_percent: 5, status: 'Yeni Planlandı', start_date: newPrj.date })
    });
  } catch(e) {}

  PROJECTS_DATA.unshift(newPrj);
  closeModal();
  selectModule('projeler');
}

async function submitNewPersonnel() {
  const name = document.getElementById('perNameInput').value || 'Burak Demiröz';
  const role = document.getElementById('perRoleInput').value;
  const certs = document.getElementById('perCertInput').value || 'Mesleki Yeterlilik Belgesi';
  const site = document.getElementById('perSiteInput').value;
  const status = document.getElementById('perStatusInput').value;

  const newPer = { name: name, role: role, certs: certs, site: site, status: status, isNew: true };

  try {
    await fetch(`${API_BASE}/personnel`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ full_name: name, role: role, certs: certs, assigned_site: site, status: status })
    });
  } catch(e) {}

  PERSONNEL_DATA.unshift(newPer);
  closeModal();
  selectModule('personel');
}

function closeModal(e){
  if(!e || e.target.classList.contains('modal-overlay') || e.target.innerText==='✕' || e.target.innerText==='İptal'){

  }
}

    {label:'Perde Duvar',      start:40, end:68, color:'#FF5A1F', week:'Hafta 4 - 6'},
    {label:'Kolon İmalatı',    start:50, end:78, color:'#FF5A1F', week:'Hafta 5 - 7'},
    {label:'Kiriş İmalatı',    start:60, end:85, color:'#F0A824', week:'Hafta 6 - 8'},

  ] : [
    {label:'Kazı Çalışmaları', start:0,  end:16, color:'#8C8272'},
    {label:'Radye Temel',      start:14, end:38, color:'#3F8F5B'},

  const container = document.getElementById('ganttChart') || document.getElementById('ganttChart2');

}
